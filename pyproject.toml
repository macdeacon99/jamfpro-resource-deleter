[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jamf-resource-deleter"
version = "0.2.0"
description = "A module that reads JSON files of Jamf resources (IDs) and deletes them"
readme = "README.md"
authors = [{name = "Gordon Deacon", email = "gdeacon99@gmail.com"}]
license = {text = "Apache 2.0"}
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "json",
    "pathlib",
    "jamfpy"
]
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/macdeacon99/jamfpro-resource-deleter"