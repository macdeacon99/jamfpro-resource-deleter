name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  Build Test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          python3 -m pip install types-requests

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy jamf_resource_deleter

      - name: Build package
        run: python -m build

      - name: Security scan
        run: bandit -r jamf_resource_deleter/
